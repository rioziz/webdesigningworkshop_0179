<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>
</head>
<body>

    <h2 align="center">Student Registration Form</h2>

    <!-- method="post": data sent in request body
         action="submit.html": page that receives the data -->
    <form method="post" action="submit.html">

        <!-- Full Name -->
        <p>
            <label for="fullname">Full Name:</label>
            <input type="text" id="fullname" name="fullname"
                   placeholder="Enter your full name" required>
        </p>

        <!-- Email: type="email" validates the format -->
        <p>
            <label for="email">Email:</label>
            <input type="email" id="email" name="email"
                   placeholder="Enter a valid email address" required>
        </p>

        <!-- Password -->
        <p>
            <label for="password">Password:</label>
            <input type="password" id="password" name="password"
                   placeholder="Enter password" minlength="6" required>
        </p>

        <!-- Gender (same name = only one selectable) -->
        <p>
            Gender:
            <input type="radio" id="male" name="gender" value="male" required>
            <label for="male">Male</label>

            <input type="radio" id="female" name="gender" value="female">
            <label for="female">Female</label>

            <input type="radio" id="other" name="gender" value="other">
            <label for="other">Other</label>
        </p>

        <!-- Course -->
        <p>
            <label for="course">Course:</label>
            <select id="course" name="course" required>
                <option value="">-- Select Course --</option>
                <option value="btech">B.Tech</option>
                <option value="bca">BCA</option>
                <option value="bsc">B.Sc</option>
                <option value="mca">MCA</option>
            </select>
        </p>

        <!-- Contact: exactly 10 digits -->
        <p>
            <label for="contact">Contact No:</label>
            <input type="tel" id="contact" name="contact"
                   placeholder="Enter phone number"
                   pattern="[0-9]{10}" title="Enter a 10-digit phone number" required>
        </p>

        <!-- Address -->
        <p>
            <label for="address">Address:</label><br>
            <textarea id="address" name="address" rows="4" cols="40"
                      placeholder="Enter your address" required></textarea>
        </p>

        <!-- Submit and Reset -->
        <p>
            <input type="submit" value="Register">
            <input type="reset" value="Clear">
        </p>

    </form>

    <hr>
    <p align="center">&copy; 2025 Student Registration Portal</p>

</body>
</html>
